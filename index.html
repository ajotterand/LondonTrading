<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ping">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='60' r='34' fill='%23FF7A1A'/%3E%3Cellipse cx='50' cy='31' rx='32' ry='7' fill='%23151B2C'/%3E%3Cpath d='M29 31C29 9 71 9 71 31z' fill='%23151B2C'/%3E%3Ccircle cx='40' cy='60' r='5' fill='%23151B2C'/%3E%3Ccircle cx='60' cy='60' r='5' fill='%23151B2C'/%3E%3C/svg%3E">
<title>Ping, trader à Londres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF1E5; --card:#FFF9F3; --ink:#14213D; --ink2:#5A6480; --line:#EED6C2;
  --navy:#14213D; --long:#0B7A4B; --short:#C8102E; --ball:#FF7A1A; --hat:#151B2C; --band:#8E1B2B;
  --up:#8BE8B4; --down:#FF9EAA;
  --font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1828; --card:#172338; --ink:#F7E8DA; --ink2:#A7B0C4; --line:#28364F;
    --navy:#0A1120; --long:#20A86C; --short:#E2334B; --hat:#34415F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1828; --card:#172338; --ink:#F7E8DA; --ink2:#A7B0C4; --line:#28364F;
  --navy:#0A1120; --long:#20A86C; --short:#E2334B; --hat:#34415F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--paper);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ball);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

/* Barre du haut : costume à fines rayures */
.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 16px 12px;color:#FFF1E5;border-radius:0 0 20px 20px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 10px),var(--navy)}
.lbl{font-size:12.5px;opacity:.72;font-weight:500}
.pnl{font-size:32px;font-weight:800;font-variation-settings:"opsz" 96;letter-spacing:-.03em;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.pnl.up{color:var(--up)} .pnl.down{color:var(--down)}
.round{text-align:right}
.round b{display:block;font-size:20px;font-weight:700;line-height:1.1;margin-top:2px}
.limit{height:4px;border-radius:4px;background:rgba(255,241,229,.15);margin-top:7px;overflow:hidden;width:120px}
.limit i{display:block;height:100%;width:0;background:var(--down);transition:width .5s}

.main{flex:1;min-height:0;overflow:auto;padding:0 14px}
.ping-row{display:flex;align-items:center;gap:8px;padding-top:10px}
.ping{width:62px;height:62px;flex:none;overflow:visible}
.say{background:var(--card);border:1.5px solid var(--ink);border-radius:15px 15px 15px 4px;padding:7px 12px;font-weight:600;font-size:14.5px;line-height:1.3;max-width:100%}

.deal{margin-top:10px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 14px 8px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.date{background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;font-weight:700;font-size:12.5px}
.name{font-size:29px;font-weight:800;font-variation-settings:"opsz" 72;letter-spacing:-.025em;line-height:1.05;margin:7px 0 5px}
.teaser{font-size:15.5px;line-height:1.42;margin:0}
.chart{display:block;width:100%;height:auto;margin-top:8px;overflow:hidden}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .now{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 4}
.chart .pre{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .post{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink2)}
.chart .big{font-size:17px;font-weight:800}

.result{display:none;margin-top:4px;padding:10px 0 4px;border-top:1.5px dashed var(--line)}
.result.on{display:block}
.delta{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.delta.up{color:var(--long)} .delta.down{color:var(--short)}
.how{font-size:13.5px;color:var(--ink2);margin-top:3px}
.outcome{font-size:15px;line-height:1.42;margin:7px 0 0}

/* Bas : mise et boutons */
.bottom{flex:none;padding:8px 14px 12px}
.stake{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--ink2);margin-bottom:5px}
.stake b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:100%;background:var(--ball);border-radius:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-btn{border:0;border-radius:20px;padding:15px 8px 13px;color:#fff;font-weight:800;font-size:25px;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;gap:1px;
  box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.big-btn small{font-size:12.5px;font-weight:600;opacity:.9;letter-spacing:0}
.big-btn kbd{font-family:inherit;font-size:11px;opacity:.6;font-weight:500}
.b-short{background:var(--short)} .b-long{background:var(--long)}
.next{position:relative;overflow:hidden;width:100%;border:0;border-radius:20px;padding:17px;font-size:19px;font-weight:800;background:var(--ink);color:var(--paper)}
.next span{position:relative;z-index:1}
.next i{position:absolute;inset:0;width:0;background:var(--ball);opacity:.35}
.hide{display:none!important}

/* Fenêtres */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(10,17,32,.55)}
.modal.on{display:flex}
.sheet{width:min(560px,100%);max-height:94%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:620px){.modal{align-items:center}.sheet{border-radius:24px;padding-bottom:22px}}
.hero{display:flex;align-items:center;gap:14px}
.hero .ping{width:96px;height:96px}
.title{font-size:72px;font-weight:800;font-variation-settings:"opsz" 96;letter-spacing:-.05em;line-height:.85;margin:0}
.title small{display:block;font-size:17px;letter-spacing:-.01em;font-weight:600;color:var(--ink2);margin-top:16px}
.sheet p{font-size:15.5px;line-height:1.45;margin:10px 0}
.rules{list-style:none;padding:0;margin:14px 0}
.rules li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.rules li:last-child{border-bottom:1px solid var(--line)}
.chip{flex:none;min-width:58px;text-align:center;border-radius:10px;padding:3px 0;color:#fff;font-weight:800;font-size:13px}
.chip.l{background:var(--long)} .chip.s{background:var(--short)} .chip.o{background:var(--ball)} .chip.n{background:var(--ink);color:var(--paper)}
.go{width:100%;border:0;border-radius:18px;padding:16px;font-size:19px;font-weight:800;background:var(--ball);color:#1A1205;margin-top:6px}
.alt{width:100%;border:1.5px solid var(--line);background:transparent;border-radius:18px;padding:14px;font-size:16px;font-weight:700;margin-top:10px}
.fine{font-size:12.5px;color:var(--ink2);margin-top:12px}
.msg{background:var(--card);border:1.5px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:16px;line-height:1.45;margin:12px 0}
.from{font-size:13px;color:var(--ink2);font-weight:600}
.score{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.score.up{color:var(--long)} .score.down{color:var(--short)}
.rank{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.stats div{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px 11px;font-size:12.5px;color:var(--ink2)}
.stats b{display:block;font-size:17px;color:var(--ink);margin-top:2px;line-height:1.2}
.fca{border:2px solid var(--short);border-radius:16px;padding:12px 14px;margin:12px 0}
.fca strong{color:var(--short)}

/* ===== Niveau 2 : circuit ===== */
.race{position:fixed;inset:0;z-index:40;background:#3F8040;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
.race #rc{position:absolute;inset:0;width:100%;height:100%;display:block}
.r-top{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.nigel{display:flex;align-items:center;gap:8px;padding-right:52px}
.nigel svg{width:54px;height:54px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.r-say{background:#fff;color:#14213D;border:2px solid #14213D;border-radius:16px 16px 16px 4px;padding:7px 12px;font-weight:800;font-size:16px;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.r-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.r-stats{display:flex;gap:6px}
.r-stats div{background:rgba(20,33,61,.85);color:#FFF1E5;border-radius:12px;padding:5px 9px;font-size:11px;line-height:1.15;font-weight:600}
.r-stats b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#mini{width:118px;height:84px;background:rgba(20,33,61,.6);border-radius:12px;flex:none}
.r-quit{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:14px;border:0;background:rgba(20,33,61,.85);color:#fff;font-weight:800;font-size:15px;letter-spacing:1px}
.r-count{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:92px;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.3);pointer-events:none}
.r-ctrl{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.steer{display:flex;gap:10px}
.r-btn{width:84px;height:84px;border-radius:24px;border:2px solid rgba(255,255,255,.6);background:rgba(20,33,61,.6);color:#fff;font-size:30px;font-weight:800;touch-action:none;-webkit-user-select:none;user-select:none}
.r-btn.on{background:rgba(255,122,26,.9);border-color:#fff}
.r-btn.brake{width:118px;font-size:22px;background:rgba(200,16,46,.65)}
.r-btn.brake.on{background:#C8102E}
@media (max-width:360px){.r-btn{width:72px;height:76px}.r-btn.brake{width:100px}}
@media (max-height:700px){.name{font-size:24px}.teaser{font-size:14.5px}.ping{width:50px;height:50px}.big-btn{padding:12px 8px 10px;font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font-size:14px;font-weight:700}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pingArt" viewBox="0 0 100 100">
    <ellipse cx="50" cy="97" rx="24" ry="3" fill="#000" opacity=".12"/>
    <circle cx="50" cy="61" r="33" fill="var(--ball)"/>
    <ellipse cx="37" cy="47" rx="9" ry="6" fill="#fff" opacity=".35"/>
    <ellipse cx="50" cy="32" rx="32" ry="6.5" fill="var(--hat)"/>
    <path d="M29 32C29 10 71 10 71 32z" fill="var(--hat)"/>
    <path d="M29.6 25h40.8l.4 5H29.2z" fill="var(--band)"/>
  </symbol>
</svg>

<div id="app">
  <header class="top">
    <div>
      <div class="lbl" data-i18n="pnlLbl">Résultat de Ping</div>
      <div class="pnl" id="pnl">£0</div>
    </div>
    <div class="round">
      <div class="lbl" data-i18n="roundLbl">Opportunité</div>
      <b id="roundNo">–</b>
      <div class="limit"><i id="limitBar"></i></div>
    </div>
  </header>

  <main class="main">
    <div class="ping-row">
      <svg class="ping" id="pingFace" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#pingArt"/>
        <g id="eyes"><circle cx="40" cy="60" r="4.3" fill="#151B2C"/><circle cx="60" cy="60" r="4.3" fill="#151B2C"/></g>
        <path id="mouth" d="M42 73Q50 76 58 73" fill="none" stroke="#151B2C" stroke-width="3" stroke-linecap="round"/>
        <path id="sweat" d="M80 44c3 5 4 8 1.5 9.5S76 52 77 49z" fill="#7CC4FF" opacity="0"/>
      </svg>
      <div class="say" id="say" aria-live="polite"></div>
    </div>

    <section class="deal" aria-live="polite">
      <div class="meta"><span class="date" id="date">–</span><span id="kind"></span></div>
      <h1 class="name" id="name"></h1>
      <p class="teaser" id="teaser"></p>
      <svg class="chart" id="chart" viewBox="0 0 320 168" role="img"></svg>
      <div class="result" id="result">
        <div class="delta" id="delta"></div>
        <div class="how" id="how"></div>
        <p class="outcome" id="outcome"></p>
      </div>
    </section>
  </main>

  <footer class="bottom">
    <div id="deciding">
      <div class="stake"><span><span data-i18n="stakeLbl">Mise de Ping</span> <small data-i18n="stakeHint"></small></span><b id="stake">£3,0 M</b></div>
      <div class="bar"><i id="timeBar"></i></div>
      <div class="btns">
        <button class="big-btn b-short" id="bShort">↓ <span data-i18n="short">Short</span><small data-i18n="shortSub"></small></button>
        <button class="big-btn b-long" id="bLong">↑ <span data-i18n="long">Long</span><small data-i18n="longSub"></small></button>
      </div>
    </div>
    <button class="next hide" id="bNext"><i id="nextFill"></i><span id="nextTxt" data-i18n="next">Suivant</span></button>
  </footer>
</div>

<div id="race" class="race hide">
  <canvas id="rc"></canvas>
  <div class="r-top">
    <div class="nigel">
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <circle id="nSkin" cx="30" cy="33" r="21" fill="#F0C2A0"/>
        <path d="M10 33c0-9 3-14 7-16-1 5-1 11 0 17zM50 33c0-9-3-14-7-16 1 5 1 11 0 17z" fill="#B9B9B9"/>
        <path id="nBrows" d="M17 26l9 1M43 26l-9 1" stroke="#6E6E6E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <circle cx="23" cy="32" r="2.2" fill="#1B1B1B"/><circle cx="37" cy="32" r="2.2" fill="#1B1B1B"/>
        <path d="M19 42q11-6 22 0q-11 3-22 0z" fill="#9C9C9C"/>
        <ellipse id="nMouth" cx="30" cy="47" rx="4" ry="1.6" fill="#5A1F1F"/>
      </svg>
      <div class="r-say" id="rSay" aria-live="polite"></div>
    </div>
    <div class="r-row">
      <div class="r-stats"><div><span data-i18n="lap">Tour</span><b id="rLap">1 / 2</b></div><div><span data-i18n="time">Temps</span><b id="rTime">0</b></div><div><span data-i18n="unit">km/h</span><b id="rSpeed">0</b></div></div>
      <canvas id="mini" width="236" height="168" aria-hidden="true"></canvas>
    </div>
  </div>
  <button class="r-quit" id="rQuit" data-i18n-aria="pause">II</button>
  <div class="r-count" id="rCount"></div>
  <div class="r-ctrl">
    <div class="steer"><button class="r-btn" data-k="left" data-i18n-aria="left">◀</button><button class="r-btn" data-k="right" data-i18n-aria="right">▶</button></div>
    <button class="r-btn brake" data-k="brake" data-i18n="brake">Frein</button>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// ===== Moteur de course (niveau 2) =====
const RaceEngine = (() => {
  const CP = [
    [420,1460],[1000,1490],[1600,1470],[2040,1400],[2220,1170],[2140,940],[1900,870],
    [1680,900],[1500,830],[1470,640],
    [1620,500],[1900,430],[2090,260],[1880,95],[1380,120],
    [980,230],[820,470],[960,700],[880,920],
    [620,980],[390,910],[220,1060],[230,1320],
  ];
  const SP = 8, HW = 48, KO = 9, GR = 70;
  const PHY = { vmax: 430, acc: 230, brake: 700, aMax: 520, wMax: 2.7, rMin: 55, scrub: 1.5, maxSlip: 1.0 };
  const CRASH = HW + KO + 6;
  const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function catmullClosed(P, seg) {
    const n = P.length, out = [], d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    const L = (a, b, ta, tb, t) => [a[0] * (tb - t) / (tb - ta) + b[0] * (t - ta) / (tb - ta), a[1] * (tb - t) / (tb - ta) + b[1] * (t - ta) / (tb - ta)];
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      const t0 = 0, t1 = t0 + Math.sqrt(d(p0, p1)), t2 = t1 + Math.sqrt(d(p1, p2)), t3 = t2 + Math.sqrt(d(p2, p3));
      for (let k = 0; k < seg; k++) {
        const t = t1 + (t2 - t1) * k / seg;
        const A1 = L(p0, p1, t0, t1, t), A2 = L(p1, p2, t1, t2, t), A3 = L(p2, p3, t2, t3, t);
        const B1 = L(A1, A2, t0, t2, t), B2 = L(A2, A3, t1, t3, t);
        out.push(L(B1, B2, t1, t2, t));
      }
    }
    return out;
  }
  function resample(pts, sp) {
    const out = [pts[0]]; let acc = 0, prev = pts[0]; const n = pts.length;
    for (let i = 1; i <= n; i++) {
      const cur = pts[i % n]; let seg = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
      while (acc + seg >= sp) { const f = (sp - acc) / seg; const p = [prev[0] + (cur[0] - prev[0]) * f, prev[1] + (cur[1] - prev[1]) * f]; out.push(p); prev = p; seg = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]); acc = 0; }
      acc += seg; prev = cur;
    }
    if (Math.hypot(out[out.length - 1][0] - out[0][0], out[out.length - 1][1] - out[0][1]) < sp * 0.5) out.pop();
    return out;
  }

  function buildTrack() {
    let c = resample(catmullClosed(CP, 24), SP); const N = c.length;
    // ligne de départ au milieu de la ligne droite du bas
    let i0 = 0, bd = 1e18; c.forEach((p, i) => { const d = (p[0] - 900) ** 2 + (p[1] - 1488) ** 2; if (d < bd) { bd = d; i0 = i; } });
    c = c.slice(i0).concat(c.slice(0, i0));
    const x = c.map(p => p[0]), y = c.map(p => p[1]);
    const tx = [], ty = [], nx = [], ny = [], k = [];
    for (let i = 0; i < N; i++) {
      const a = (i - 1 + N) % N, b = (i + 1) % N;

// ---------- Graphique (illustratif, échelle logarithmique) ----------
const W = 320, H = 168, Y0 = 90, K = 120, XNOW = 196;
const yOf = v => Y0 - Math.log(v) * K;
function prePath(card) {
  const n = 34; const vals = [1]; let v = 1;
  for (let i = 1; i < n; i++) { v *= Math.exp(gauss() * 0.022); vals.push(v); }
  vals.reverse();
  const start = card.ipo ? 22 : 0;
  let d = '';
  for (let i = start; i < n; i++) {
    const x = 8 + i * ((XNOW - 8) / (n - 1));
    const y = card.ipo ? Y0 : yOf(vals[i]);
    d += (i === start ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return d;
}
function postPoints(m) {
  const n = 16, L = Math.log(1 + m), pts = [[XNOW, Y0]];
  for (let j = 1; j <= n; j++) {
    const f = j / n;
    const e = m < 0 ? 1 - Math.pow(1 - f, 2.4) : Math.pow(f, 1.35);
    const noise = j === n ? 0 : gauss() * 0.035 * Math.max(0.2, Math.abs(L));
    pts.push([XNOW + j * ((W - 8 - XNOW) / n), yOf(Math.exp(L * e + noise))]);
  }
  return pts;
}
function drawChart(card) {
  $('#chart').innerHTML = `
    <line class="grid" x1="0" x2="${W}" y1="30" y2="30"/><line class="grid" x1="0" x2="${W}" y1="150" y2="150"/>
    <line class="now" x1="${XNOW}" x2="${XNOW}" y1="4" y2="${H - 4}"/>
    <line class="now" x1="0" x2="${W}" y1="${Y0}" y2="${Y0}" opacity=".5"/>
    <text x="${XNOW + 5}" y="14">${T().now}</text>
    ${card.ipo ? `<text x="8" y="${Y0 - 8}">${T().ipo}</text>` : ''}
    <path class="pre" d="${prePath(card)}"/>`;
}
function revealChart(card) {
  const pts = postPoints(card.m);
  const color = card.m >= 0 ? 'var(--long)' : 'var(--short)';
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const svg = $('#chart'), NS = 'http://www.w3.org/2000/svg';
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('class', 'post'); path.setAttribute('d', d); path.setAttribute('stroke', color);
  svg.appendChild(path);
  const end = pts[pts.length - 1];
  const out = end[1] < 8 || end[1] > H - 8;
  const txt = document.createElementNS(NS, 'text');
  txt.setAttribute('x', W - 8); txt.setAttribute('y', card.m >= 0 ? H - 12 : 40); txt.setAttribute('text-anchor', 'end');
  txt.setAttribute('class', 'big'); txt.style.fill = color;
  txt.textContent = (out ? (card.m >= 0 ? '↑ ' : '↓ ') : '') + pct(card.m);
  if (!reduce) {
    const len = path.getTotalLength();
    path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    path.style.transition = 'stroke-dashoffset .9s cubic-bezier(.3,.6,.2,1)';
    path.style.strokeDashoffset = 0;
    setTimeout(() => svg.appendChild(txt), 750);
  } else svg.appendChild(txt);
}

function dealCards() {

  const longs = shuffle(CARDS.filter(c => c.m > 0)), shorts = shuffle(CARDS.filter(c => c.m < 0));
  const fresh = a => a.sort((x, y) => recent.has(x.id) - recent.has(y.id));
  fresh(longs); fresh(shorts);
  const nl = 4 + ((Math.random() * 4) | 0);
  const hand = shuffle([...longs.slice(0, nl), ...shorts.slice(0, ROUNDS - nl)]);
  store.set('recent', hand.map(c => c.id));
  return hand;
}

  g.strokeStyle = '#ECE7DA'; g.lineWidth = 2 * (RE.HW + RE.KO + RE.GR) + 16; g.stroke(P.center);
  g.strokeStyle = '#26282C'; g.setLineDash([16, 16]); g.stroke(P.center); g.setLineDash([]);
  g.strokeStyle = PAT.gravel; g.lineWidth = 2 * (RE.HW + RE.KO + RE.GR); g.stroke(P.center);
  g.strokeStyle = '#4B4E55'; g.lineWidth = 2 * (RE.HW + RE.KO); g.stroke(P.center);
  g.lineCap = 'butt';
  g.strokeStyle = '#D6252F'; g.stroke(P.kerbs);
  g.strokeStyle = '#F4F1EA'; g.setLineDash([10, 10]); g.stroke(P.kerbs); g.setLineDash([]);
  g.lineCap = 'round';
  g.strokeStyle = '#4B4E55'; g.lineWidth = 2 * RE.HW; g.stroke(P.center);
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2.2; g.stroke(P.left); g.stroke(P.right);
  g.save(); g.translate(RT.x[0], RT.y[0]); g.rotate(Math.atan2(RT.ty[0], RT.tx[0]));
  for (let i = 0; i < 12; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#111' : '#fff'; g.fillRect(-8 + j * 8, -RE.HW + i * (2 * RE.HW / 12), 8, 2 * RE.HW / 12); }
  g.restore();
  if (RS && RS.skids.length) { g.fillStyle = 'rgba(20,20,20,.22)'; for (const s of RS.skids) g.fillRect(s[0] - 2, s[1] - 2, 4, 4); }
  drawCar(g, RC);
  if (RS) for (const p of RS.parts) { g.fillStyle = `rgba(${p.col},${Math.max(0, p.a)})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
  const m = RT.mini;
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.clearRect(0, 0, 236, 168); mctx.drawImage(miniBase, 0, 0);
  mctx.setTransform(2, 0, 0, 2, 0, 0); mctx.translate(m.ox, m.oy);
  mctx.fillStyle = '#FF7A1A'; mctx.beginPath(); mctx.arc((RC.x - m.minX) * m.s, (RC.y - m.minY) * m.s, 3.6, 0, 7); mctx.fill();

}
function racePause(msgKey) {
  const t = T();
  openModal(`<h2 class="rank" style="margin:0">${t.pauseT}</h2><p>${t[msgKey]}</p><button class="go" id="rRes">${t.resume}</button><button class="alt" id="rMenu">${t.menu}</button>`);
  $('#rRes').onclick = () => { closeModal(); rLast = 0; };
  $('#rMenu').onclick = exitRace;
}

// ---------- Commandes ----------
$('#bShort').addEventListener('click', () => decide('short'));
$('#bLong').addEventListener('click', () => decide('long'));
$('#bNext').addEventListener('click', () => { if (S && S.phase === 'reveal') nextRound(); });
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); rIn[k] = true; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { rIn[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
const keyMap = { ArrowLeft: 'left', a: 'left', q: 'left', ArrowRight: 'right', d: 'right', ArrowDown: 'brake', s: 'brake', ' ': 'brake' };
const racing = () => RS && !$('#race').classList.contains('hide');
document.addEventListener('keydown', e => {
  if (racing()) { const k = keyMap[e.key]; if (k) { e.preventDefault(); rIn[k] = true; document.querySelector(`[data-k="${k}"]`).classList.add('on'); } return; }
  if (!S || $('#modal').classList.contains('on')) return;
  if (e.key === 'ArrowLeft') decide('short');
  else if (e.key === 'ArrowRight') decide('long');
  else if ((e.key === 'Enter' || e.key === ' ') && S.phase === 'reveal') { e.preventDefault(); nextRound(); }
});
document.addEventListener('keyup', e => { const k = keyMap[e.key]; if (k) { rIn[k] = false; const b = document.querySelector(`[data-k="${k}"]`); if (b) b.classList.remove('on'); } });
window.addEventListener('resize', () => { if (RS) sizeRace(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && RS && RS.state === 'run' && !$('#modal').classList.contains('on')) racePause('pause1'); });
$('#rQuit').addEventListener('click', () => { if (!RS) return; if (RS.state === 'run') racePause('pause2'); else exitRace(); });

// ---------- Démarrage ----------
applyStatic();
const qs = new URLSearchParams(location.search);
if (qs.get('lang') === 'en' || qs.get('lang') === 'fr') setLang(qs.get('lang'));
if (qs.get('niveau') === '2' || qs.get('level') === '2') raceIntro(); else intro();
})();
</script>
